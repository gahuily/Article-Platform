version: '3.8'

services:
  # 1. 데이터베이스: PostgreSQL
  db:
    image: postgres:15
    container_name: ssafy_db
    volumes:
      - postgres_data:/var/lib/postgresql/data  # DB 데이터를 껐다 켜도 유지되도록 저장
    environment:
      - POSTGRES_DB=ssafy_pjt     # DB 이름
      - POSTGRES_USER=ssafy       # ID
      - POSTGRES_PASSWORD=password123 # 비밀번호
    ports:
      - "5432:5432"

  # 2. 백엔드: Django
  backend:
    build: ./backend              # backend 폴더에 있는 Dockerfile을 보고 만들어라
    container_name: ssafy_backend
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app            # 내 컴퓨터의 코드를 컨테이너와 실시간 동기화
    ports:
      - "8000:8000"
    depends_on:
      - db                        # DB가 먼저 켜져야 나도 켜진다 (순서 보장)
    environment:
      - DB_HOST=db                # ★ 중요: localhost가 아니라 서비스 이름(db)을 씀
      - DB_NAME=ssafy_pjt
      - DB_USER=ssafy
      - DB_PASSWORD=password123
      - DB_PORT=5432

volumes:
  postgres_data: